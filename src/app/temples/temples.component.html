
 <div class="container-fluid mx-3 p-4 border rounded" style="border-color: #ccc; margin-top: 100px; min-height: 300px;">
  <div class="row">

    <div class="col-md-3 border-end">
      <h5>Temples</h5>
      <hr>
      <ul class="list-unstyled">
        <li *ngFor="let temple of temples" class="mb-2">
          <button class="btn btn-outline-primary w-100 " (click)="selectTemple(temple) ">
            {{ temple.name }}
          </button>
        </li>
      </ul>
    </div>
    <div class="col-md-5 border-end">
      <h5>Temple Category</h5>
      <hr>
    
      <div *ngIf="selectedTemple">
        <!-- Centered Image -->
        <div class="d-flex justify-content-center">
          <img [src]="selectedTemple.image_location" [alt]="selectedTemple.name" 
               class="img-fluid rounded" style="height: 300px; width: 300px;">
        </div>
    
        <!-- Temple Details -->
        <div class="mt-3">
          <h6 class="text-center">{{ selectedTemple.name }}</h6>
          <p><strong>Description:</strong> {{ selectedTemple.desc }}</p>
          <p><strong>Map Location:</strong> 
            <a [href]="selectedTemple.temple_map_location" target="_blank">
              View on Map
            </a>
          </p>
          <p><strong>Address:</strong> {{ selectedTemple.address }}</p>
        </div>
      </div>
    
      <div *ngIf="!selectedTemple">
        <p>Select a temple to view its image and details</p>
      </div>
    </div>
    
    <div class="col-md-4">
      <h5>Near by Temples</h5>
      <hr>
    </div>
  </div>
</div>
